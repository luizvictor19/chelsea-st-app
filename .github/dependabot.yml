version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Types follow the Node the project runs (engines: 24.x), not the latest.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      # next and eslint-config-next are pinned to the same version.
      next:
        patterns: [next, eslint-config-next]
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [chore]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
