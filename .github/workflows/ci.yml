name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Criterion 10 is a claim about row level security, so it is checked
      # against a real Postgres with the migrations applied rather than asserted.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A high or critical advisory in a production dependency fails the PR.
      # Needs the network, so it lives here and not in npm run check (#138).
      - run: npm audit --omit=dev --audit-level=high

      # The whole tree, dev tools included: shown in the log, never blocks.
      - name: npm audit, whole tree (does not block)
        run: npm audit
        continue-on-error: true

      # The same gate AGENTS.md asks for locally, in the same order.
      - run: npx prettier --check .
      - run: npm run lint
      - run: npx tsc --noEmit
      # The tests run once, with coverage and its floor (#136).
      - run: npm run test:coverage

      - name: Criterion 10, row level security against a real Postgres
        run: psql -v ON_ERROR_STOP=1 -f scripts/verify-rls.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - run: npm run build
        env:
          # The build imports env.ts, which throws on a missing value. These are
          # placeholders: nothing in CI talks to a real project.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
